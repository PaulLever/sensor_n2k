# Extra Kconfig for the MCP2515 CAN shield build.
# Appended after prj.conf when USE_MCP2515_SHIELD=ON in CMakeLists.txt.

# Show all MCP2515 driver errors (the CAN log module defaults to LOG_DEFAULT_LEVEL
# which may suppress driver-internal LOG_ERR; force it to INF here so mode-change
# failures and SPI errors are visible during bring-up).
CONFIG_CAN_LOG_LEVEL_INF=y

# CONFIG_CAN_MCP2515 is auto-enabled by Zephyr when the mcp2515 DTS node
# exists with status = "okay" (DT_HAS_MICROCHIP_MCP2515_ENABLED).

# MCP2515 interrupt handler thread — defaults are fine but documented here.
CONFIG_CAN_MCP2515_INT_THREAD_STACK_SIZE=1024
CONFIG_CAN_MCP2515_INT_THREAD_PRIO=2

# Allow up to 16 concurrent RX filters (default; raise if more are needed).
CONFIG_CAN_MCP2515_MAX_FILTERS=16

# Larger RTT buffer — the MCP2515 on a live N2K bus produces many frame log
# lines during the 3 s sniff; the default 4096 B overflows and truncates output.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=16384

# prj.conf already adds CBPRINTF_FP_SUPPORT, FLASH, NVS, SETTINGS — all carry over.

# Note: CONFIG_CAN_STM32_FDCAN_MAX_STD_ID_FILTERS and
# CONFIG_CAN_STM32_FDCAN_MAX_EXT_ID_FILTERS from prj.conf become
# orphaned when FDCAN1 is disabled; Zephyr will warn but the build succeeds.
