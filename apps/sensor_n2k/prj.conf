CONFIG_CAN=y
CONFIG_CAN_MANUAL_RECOVERY_MODE=y
CONFIG_CAN_INIT_PRIORITY=60
CONFIG_CAN_STM32_FDCAN_MAX_STD_ID_FILTERS=28
CONFIG_CAN_STM32_FDCAN_MAX_EXT_ID_FILTERS=8

CONFIG_SPI=y
CONFIG_SPI_STM32_DMA=y

# Nocache SRAM region for GPDMA SPI buffers.
# Without this the MPU does not mark the SRAM_NOCACHE DT region as
# non-cacheable and __nocache / Z_GENERIC_SECTION(SRAM_NOCACHE) have no effect,
# leaving spi_tx/spi_rx in cached SRAM where GPDMA reads stale data.

CONFIG_ADC=y

CONFIG_GPIO=y
CONFIG_W1=y
# W1_ZEPHYR_GPIO_TIME_CRITICAL is intentionally disabled.
# With it enabled, irq_lock() is held for every 1-Wire bit slot (~60 µs),
# blocking pulse counter ISRs and causing SPI slave overruns.
# DS18B20 tolerates ~2 µs of bit-timing jitter; Cortex-M interrupt latency
# is < 1 µs, so k_busy_wait()-based timing is accurate enough without locking.
# Always use MATCH ROM addressing so w1_write_read() correctly targets
# individual sensors on a multi-drop bus (overrides the DTS slave_count heuristic)
CONFIG_W1_NET_FORCE_MULTIDROP_ADDRESSING=y
CONFIG_SENSOR=y

# Floating-point printf in LOG macros (fixes %f in onewire / adc)
CONFIG_CBPRINTF_FP_SUPPORT=y

# Persistent config via NVS in the storage_partition
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PRINTK=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048


#debug support — choose ONE of the two blocks below

# --- Option A: UART console ---
# CONFIG_CONSOLE=y
# CONFIG_UART_CONSOLE=y
# CONFIG_SERIAL=y

# --- Option B: SEGGER RTT via OpenOCD (active) ---
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SEGGER_RTT_SECTION_NONE=y
CONFIG_SEGGER_RTT_MODE_NO_BLOCK_SKIP=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

