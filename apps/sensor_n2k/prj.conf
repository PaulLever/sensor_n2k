CONFIG_CAN=y
CONFIG_CAN_MANUAL_RECOVERY_MODE=y
CONFIG_CAN_INIT_PRIORITY=60
CONFIG_CAN_STM32_FDCAN_MAX_STD_ID_FILTERS=28
CONFIG_CAN_STM32_FDCAN_MAX_EXT_ID_FILTERS=8

CONFIG_SPI=y

CONFIG_ADC=y

CONFIG_GPIO=y
CONFIG_W1=y
CONFIG_W1_ZEPHYR_GPIO_TIME_CRITICAL=y
CONFIG_SENSOR=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PRINTK=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048


#debug support — choose ONE of the two blocks below

# --- Option A: UART console ---
# CONFIG_CONSOLE=y
# CONFIG_UART_CONSOLE=y
# CONFIG_SERIAL=y

# --- Option B: SEGGER RTT via OpenOCD (active) ---
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SEGGER_RTT_SECTION_NONE=y
CONFIG_SEGGER_RTT_MODE_NO_BLOCK_SKIP=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

