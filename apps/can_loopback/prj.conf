# FDCAN loopback bring-up for the UNO Q STM32U585.
# Proves CAN frames TX/RX round-trip entirely on-chip (no transceiver).

CONFIG_CAN=y
CONFIG_CAN_STM32_FDCAN=y
CONFIG_GPIO=y
CONFIG_PINCTRL=y

# Console + log to watch frames round-trip.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y

CONFIG_MAIN_STACK_SIZE=2048
