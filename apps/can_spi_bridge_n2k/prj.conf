# NMEA 2000 CAN<->SPI bridge for the UNO Q STM32U585.
# Classic CAN 2.0B (NOT FD), 250 kbit/s, 29-bit extended IDs.

CONFIG_CAN=y
CONFIG_CAN_STM32_FDCAN=y
# NOTE: no CONFIG_CAN_FD_MODE -- N2K is classic CAN only.

CONFIG_SPI=y
CONFIG_SPI_SLAVE=y
CONFIG_SPI_STM32_INTERRUPT=y

CONFIG_GPIO=y
CONFIG_PINCTRL=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096
